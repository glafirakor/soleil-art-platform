name: SOLEIL CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build Docker Images & Validate Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Backend Syntax
        run: python -m py_compile backend/main.py

      - name: Validate Docker Compose Configuration
        run: docker compose config -q

      - name: Build Frontend Docker Image
        run: docker build -t soleil-frontend:${{ github.sha }} ./frontend

      - name: Build Backend Docker Image
        run: docker build -t soleil-backend:${{ github.sha }} ./backend
